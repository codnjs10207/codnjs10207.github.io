<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <!-- Pretendard Web Font CDN -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <!-- FontAwesome for Premium Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Main CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="nav-container">
      <a class="site-title" href="{{ '/' | relative_url }}">
        <span class="title-gradient">{{ site.title }}</span>
      </a>
      <nav class="nav-links">
        <a href="{{ '/' | relative_url }}" class="nav-item {% if page.url == '/' or page.url == '/index.html' %}active{% endif %}">
          <i class="fa-solid fa-house"></i> <span>Home</span>
        </a>
        <a href="{{ '/projects/' | relative_url }}" class="nav-item {% if page.url contains '/projects' %}active{% endif %}">
          <i class="fa-solid fa-code"></i> <span>Projects</span>
        </a>
        <a href="{{ '/til/' | relative_url }}" class="nav-item {% if page.url contains '/til' %}active{% endif %}">
          <i class="fa-solid fa-book-open"></i> <span>TIL</span>
        </a>
        <a href="{{ '/about/' | relative_url }}" class="nav-item {% if page.url contains '/about' %}active{% endif %}">
          <i class="fa-solid fa-user"></i> <span>About</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="main-content animate-fade-in">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <p class="copyright">&copy; {{ site.time | date: '%Y' }} <span class="gradient-text font-semibold">{{ site.title }}</span>. All rights reserved.</p>
      <div class="footer-socials">
        <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
          <i class="fa-brands fa-github"></i>
        </a>
        <a href="mailto:{{ site.email }}" aria-label="Email">
          <i class="fa-solid fa-envelope"></i>
        </a>
      </div>
    </div>
  </footer>
</body>
</html>
